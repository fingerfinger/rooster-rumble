    function renderCurrentItems() {
      const cfg = getMenuItemConfig(activeMenuId);
      if (!cfg || !window.BOARD_DATA) return;

      let items = getItemsForFilter(cfg.item.filter, window.BOARD_DATA.items);

      if (searchQuery) {
        items = items.filter(item => {
          const matchTitle = item.title && item.title.toLowerCase().includes(searchQuery);
          const matchDesc = item.desc && item.desc.toLowerCase().includes(searchQuery);
          const matchTags = item.tags && item.tags.some(t => t.toLowerCase().includes(searchQuery));
          const matchUrl = item.url && item.url.toLowerCase().includes(searchQuery);
          return matchTitle || matchDesc || matchTags || matchUrl;
        });
      }

      items.sort((a, b) => {
        const aIssue = pinnedIssueIds.has(a.id) ? 1 : 0;
        const bIssue = pinnedIssueIds.has(b.id) ? 1 : 0;
        if (bIssue !== aIssue) return bIssue - aIssue;
        const aDemo = (a.is_demo || a.category === 'demos') ? 1 : 0;
        const bDemo = (b.is_demo || b.category === 'demos') ? 1 : 0;
        if (bDemo !== aDemo) return bDemo - aDemo;
        const aFinal = (a.is_final || (a.badge && a.badge.includes('최종'))) ? 1 : 0;
        const bFinal = (b.is_final || (b.badge && b.badge.includes('최종'))) ? 1 : 0;
        if (bFinal !== aFinal) return bFinal - aFinal;
        return (b.bytes || 0) - (a.bytes || 0);
      });

      // 서브 필터 탭 바 렌더링
      renderSubFilterBar(items);

      // 서브 필터 적용 (all이 아닌 경우 해당 모드만)
      let displayItems = items;
      if (activeSubFilter !== 'all' && ['view_final', 'view_all', 'view_demos'].includes(activeMenuId)) {
        displayItems = items.filter(i => i.game_mode === activeSubFilter);
      }

      document.getElementById('currentViewCount').textContent = `${displayItems.length}개 항목`;

      const grid = document.getElementById('itemsGrid');
      if (displayItems.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>🔍 등록된 산출물이 없습니다.</h3>
            <p>${activeMenuId === 'view_issues' ? '문서를 열람할 때 상단의 [📌 필독 등록] 버튼을 누르면 이 카테고리에 모아집니다.' : '검색어가 입력되어 있다면 지우거나 다른 메뉴를 선택해보세요.'}</p>
          </div>`;
        return;
      }

      // view_final 또는 view_all 이면서 activeSubFilter가 'all'일 때는 모드별 섹션으로 그룹화 표시!
      const shouldGroup = (activeMenuId === 'view_final' || activeMenuId === 'view_all') && activeSubFilter === 'all' && !searchQuery;

      if (shouldGroup) {
        const groups = [
          { mode: 'common', title: '공통 / 통합 핵심 산출물 (Core & QA)', icon: '🌟' },
          { mode: 'race', title: 'Derby Race (경주 모드 핵심 산출물)', icon: '🏇' },
          { mode: 'pit', title: 'Rumble Pit (격투 모드 핵심 산출물)', icon: '🥊' },
          { mode: 'farm', title: 'Rumble Farm (농장 모드 핵심 기획)', icon: '🌾' }
        ];

        let html = '';
        groups.forEach(g => {
          const groupItems = displayItems.filter(i => i.game_mode === g.mode);
          if (groupItems.length > 0) {
            html += `
              <div class="category-section" id="sec-group-${g.mode}" style="grid-column: 1 / -1;">
                <div class="section-divider-header mode-${g.mode}">
                  <div class="section-divider-title">
                    <span>${g.icon}</span>
                    <span>${stripLeadingEmoji(g.title)}</span>
                  </div>
                  <span class="section-divider-count">${groupItems.length}개 산출물</span>
                </div>
                <div class="items-grid ${viewMode === 'list' ? 'list-view' : ''}" style="margin-bottom: 24px;">
                  ${groupItems.map(renderCardHtml).join('')}
                </div>
              </div>
            `;
          }
        });
        grid.innerHTML = html;
      } else {
        grid.innerHTML = displayItems.map(renderCardHtml).join('');
      }
    }

    // Advanced Markdown Reader
    function parseCustomMarkdown(mdText) {
      if (typeof marked === 'undefined') {
        return `<pre>${mdText}</pre>`;
      }

      let processed = mdText.replace(
        /> \[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\n((?:> .*(?:\n|$))*)/gi,
        (match, type, content) => {
          const typeLower = type.toLowerCase();
          const titleMap = {
            note: '📌 Note',
            tip: '💡 Tip',
            important: '❗ Important',
            warning: '⚠️ Warning',
            caution: '🛑 Caution'
          };
          const cleanContent = content.replace(/^> ?/gm, '');
          return `<div class="gh-alert gh-alert-${typeLower}"><div class="gh-alert-title">${titleMap[typeLower] || type}</div>${cleanContent}</div>\n\n`;
        }
      );

      marked.setOptions({
        gfm: true,
        breaks: true,
        headerIds: true
      });

      return marked.parse(processed);
    }

    function openMarkdownViewer(itemId) {

      if (!item) return;
      if (currentUserRole !== 'master' && item.is_hidden) {
        showToast('🔒 비공개 문서입니다. 열람 권한이 없습니다.', '🔒');
        return;

      currentViewingItemId = itemId;

      const modalTitle = document.getElementById('modalTitle');

      const extLink = document.getElementById('modalExternalLink');

      const fontCtrl = document.getElementById('modalFontControls');
      const copyBtn = document.getElementById('btnCopyContent');

      modalTitle.innerHTML = `📑 ${item.title}`;
      modalSubInfo.textContent = `${item.url} (${item.file_size || ''})`;
      extLink.href = `viewer.html?id=${item.id}`;
      dlLink.href = item.url;

              <div class="empty-state">

              </div>`;
          });

      modal.classList.add('active');

    function renderMarkdownReader(rawText) {
      currentRawContent = rawText;
      const modalBody = document.getElementById('modalBody');

      const htmlContent = parseCustomMarkdown(rawText);

      modalBody.innerHTML = `
        <div class="md-reader-container">
          <div class="md-content-scroll" id="mdScrollWrap">
            <article class="markdown-body" id="renderedMarkdown" style="font-size: ${currentFontSize}px;">
              ${htmlContent}
            </article>
          </div>
          <aside class="md-toc-sidebar" id="mdTocSidebar">
            <div class="md-toc-header">📑 문서 목차 (TOC)</div>
            <div id="tocLinksList" style="display:flex; flex-direction:column; gap:2px;"></div>
          </aside>
        </div>
      `;

      setTimeout(buildTableOfContents, 50);
    }

    function buildTableOfContents() {
      const container = document.getElementById('renderedMarkdown');
      const tocList = document.getElementById('tocLinksList');
      if (!container || !tocList) return;

      const headings = container.querySelectorAll('h1, h2, h3');
      if (headings.length === 0) {
        tocList.innerHTML = `<span style="font-size:0.75rem; color:var(--text-muted);">목차 항목이 없습니다.</span>`;
        return;
      }

      let tocHtml = '';
      headings.forEach((h, idx) => {
        const id = h.id || `heading-${idx}`;
        h.id = id;
        const tag = h.tagName.toLowerCase();
        const text = h.textContent.trim();
        tocHtml += `
          <a href="#${id}" class="md-toc-link toc-${tag}" onclick="scrollToHeading('${id}'); return false;">
            ${text}
          </a>
        `;
      });
      tocList.innerHTML = tocHtml;
    }

    function scrollToHeading(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.max(12, Math.min(24, currentFontSize + delta));
      const targetMd = document.getElementById('renderedMarkdown');
      if (targetMd) {
        targetMd.style.fontSize = currentFontSize + 'px';
      }
      const targetTxt = document.getElementById('renderedText');
      if (targetTxt) {
        targetTxt.style.fontSize = currentFontSize + 'px';
      }
    }

      if (!currentRawContent) return;
      navigator.clipboard.writeText(currentRawContent).then(() => {
        const btn = document.getElementById('btnCopyContent');
        btn.textContent = '✅ 복사됨!';
        setTimeout(() => btn.textContent = '📋 복사', 1800);

    function renderCsvTable(csvText) {
      const modalBody = document.getElementById('modalBody');
      const rows = csvText.trim().split('\n').map(r => r.split(','));
      if (rows.length === 0) return;
      let table = '<div class="md-content-scroll"><table style="width:100%; border-collapse:collapse; color:#e6edf3; font-size:0.85rem;"><thead><tr>';
      rows[0].forEach(th => table += `<th style="background:#1e2436; padding:8px 12px; border:1px solid #30363d; text-align:left;">${escapeHtml(th.trim())}</th>`);
      table += '</tr></thead><tbody>';
      for (let i = 1; i < rows.length; i++) {
        table += '<tr style="border-bottom:1px solid #21262d;">';
        rows[i].forEach(td => table += `<td style="padding:6px 12px; border:1px solid #242b3d;">${escapeHtml(td.trim())}</td>`);
        table += '</tr>';
      }
      table += '</tbody></table></div>';
      modalBody.innerHTML = table;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    }

    function closeModal() {
      const modal = document.getElementById('universalModal');
      modal.classList.remove('active');
      document.getElementById('modalBody').innerHTML = '';
      currentRawContent = '';
      currentViewingItemId = null;
    }

    function handleModalOverlayClick(e) {
      if (e.target.id === 'universalModal') closeModal();
    }

    // Audio Playback Engine
    function setupAudioEvents() {
      audioElement.addEventListener('timeupdate', () => {
        const cur = audioElement.currentTime;
        const dur = audioElement.duration || 0;
        const pct = dur > 0 ? (cur / dur) * 100 : 0;

        document.getElementById('globalAudioCurrent').textContent = formatAudioTime(cur);
        document.getElementById('globalAudioDuration').textContent = formatAudioTime(dur);
        document.getElementById('globalAudioProgress').style.width = pct + '%';

        if (currentPlayingItem) {
          const cardCur = document.getElementById(`currentTime-${currentPlayingItem.id}`);
          const cardProg = document.getElementById(`progress-${currentPlayingItem.id}`);
          if (cardCur) cardCur.textContent = formatAudioTime(cur);
          if (cardProg) cardProg.style.width = pct + '%';
        }
      });

      audioElement.addEventListener('loadedmetadata', () => {
        const dur = audioElement.duration || 0;
        document.getElementById('globalAudioDuration').textContent = formatAudioTime(dur);
        if (currentPlayingItem) {
          const cardDur = document.getElementById(`duration-${currentPlayingItem.id}`);
          if (cardDur) cardDur.textContent = formatAudioTime(dur);
        }
      });

      audioElement.addEventListener('ended', resetAudioPlayState);

      audioElement.addEventListener('pause', () => {
        document.getElementById('btnGlobalPlay').textContent = '▶';
        if (currentPlayingItem) {
          const btn = document.getElementById(`playBtn-${currentPlayingItem.id}`);
          if (btn) btn.textContent = '▶';
        }
      });

      audioElement.addEventListener('play', () => {
        document.getElementById('btnGlobalPlay').textContent = '❚❚';
        if (currentPlayingItem) {
          const btn = document.getElementById(`playBtn-${currentPlayingItem.id}`);
          if (btn) btn.textContent = '❚❚';
        }
      });
    }

    function playAudioItem(itemId) {
      const item = window.BOARD_DATA.items.find(i => i.id === itemId);
      if (!item) return;

      if (currentPlayingItem && currentPlayingItem.id === itemId) {
        if (audioElement.paused) audioElement.play();
        else audioElement.pause();
        return;
      }

      if (currentPlayingItem) {
        const prevBtn = document.getElementById(`playBtn-${currentPlayingItem.id}`);
        if (prevBtn) prevBtn.textContent = '▶';
      }

      currentPlayingItem = item;
      audioElement.src = item.url;
      audioElement.play();

      document.getElementById('globalAudioTitle').textContent = item.title;
      globalAudioBar.classList.add('active');

      const btn = document.getElementById(`playBtn-${item.id}`);
      if (btn) btn.textContent = '❚❚';
    }

    function toggleGlobalAudio() {
      if (audioElement.src) {
        if (audioElement.paused) audioElement.play();
        else audioElement.pause();
      }
    }

    function closeGlobalAudio() {
      audioElement.pause();
      globalAudioBar.classList.remove('active');
      resetAudioPlayState();
    }

    function seekGlobalAudio(e) {
      if (!audioElement.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audioElement.currentTime = pos * audioElement.duration;
    }

    function seekAudioItem(e, itemId) {
      if (!audioElement.duration || !currentPlayingItem || currentPlayingItem.id !== itemId) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      audioElement.currentTime = pos * audioElement.duration;
    }

    function resetAudioPlayState() {
      if (currentPlayingItem) {
        const btn = document.getElementById(`playBtn-${currentPlayingItem.id}`);
        const prog = document.getElementById(`progress-${currentPlayingItem.id}`);
        if (btn) btn.textContent = '▶';
        if (prog) prog.style.width = '0%';
      }
      document.getElementById('globalAudioProgress').style.width = '0%';
    }

    function formatAudioTime(sec) {
      if (!sec || isNaN(sec)) return '00:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        closeSettingsModal();
      }
    });
  </script>
</body>
</html>
