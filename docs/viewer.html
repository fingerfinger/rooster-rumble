<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보안 확인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="board_data.js?v=261110225959"></script>

  <style>
    :root {
      --bg-base: #0c0e14;
      --bg-surface: #141824;
      --border-subtle: #242b3d;
      --accent-primary: #ff5722;
      --accent-cyan: #00e5ff;
      --text-main: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    [data-theme="light"] {
      --bg-base: #f4f6fa;
      --bg-surface: #ffffff;
      --border-subtle: #e2e8f0;
      --accent-primary: #f2552c;
      --accent-cyan: #0284c7;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
    }

    [data-theme="light"] .markdown-body {
      color: #24292f;
    }
    [data-theme="light"] .markdown-body h1,
    [data-theme="light"] .markdown-body h2,
    [data-theme="light"] .markdown-body h3 {
      color: #0f172a;
      border-bottom-color: #d0d7de;
    }
    [data-theme="light"] .markdown-body code {
      background: #f6f8fa;
      color: #b45309;
    }
    [data-theme="light"] .markdown-body pre {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
    }
    [data-theme="light"] .markdown-body pre code {
      background: transparent;
      color: #24292f;
    }
    [data-theme="light"] .toc-sidebar {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    [data-theme="light"] .toc-link:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    [data-theme="light"] .text-body-wrap {
      background: #ffffff !important;
      color: #1e293b !important;
      border: 1px solid #e2e8f0 !important;
    }

    /* Root Font Size & Settings Scaling */
    html {
      font-size: 15px;
    }
    html[data-font-size="small"] {
      font-size: 15px;
    }
    html[data-font-size="large"] {
      font-size: 17.5px;
    }
    html[data-font-size="xlarge"] {
      font-size: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn {
      background: #1e2436;
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:hover { background: #2a334d; }
    .btn-pin {
      border: 1px solid rgba(255, 82, 82, 0.4);
      color: #ff8a80;
      background: rgba(255, 82, 82, 0.08);
      font-weight: 600;
    }
    .btn-pin:hover {
      background: rgba(255, 82, 82, 0.2);
    }
    .btn-pin.pinned {
      background: rgba(255, 82, 82, 0.2);
      border-color: #ff5252;
      color: #ff5252;
    }

    .toast-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1a2030;
      border: 1px solid var(--accent-cyan);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 2000;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .toast-box.show {
      transform: translateY(0);
      opacity: 1;
    }

    .layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .content-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 40px 60px;
      scroll-behavior: smooth;
    }

    .markdown-body {
      max-width: 900px;
      margin: 0 auto;
      color: #c9d1d9;
      font-size: 15px;
      line-height: 1.7;
    }

    .markdown-body h1 {
      font-size: 1.9rem;
      color: #fff;
      border-bottom: 1px solid #30363d;
      padding-bottom: 0.3em;
      margin: 1.2em 0 0.8em;
    }
    .markdown-body h2 {
      font-size: 1.45rem;
      color: #f0f6fc;
      border-bottom: 1px solid #21262d;
      padding-bottom: 0.3em;
      margin: 1.4em 0 0.6em;
    }
    .markdown-body h3 {
      font-size: 1.18rem;
      color: #e6edf3;
      margin: 1.2em 0 0.5em;
    }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin-bottom: 1em; }
    .markdown-body ul, .markdown-body ol { padding-left: 24px; }
    .markdown-body a { color: #58a6ff; text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 1.2em 0; }
    .markdown-body th, .markdown-body td { border: 1px solid #30363d; padding: 8px 14px; text-align: left; }
    .markdown-body th { background: #161b22; color: #fff; }
    .markdown-body code { background: #161b22; color: #ff7b72; padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.88em; }
    .markdown-body pre { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; overflow-x: auto; margin: 1.2em 0; }
    .markdown-body pre code { background: transparent; color: #e6edf3; padding: 0; }
    .text-body-wrap {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      font-family: 'JetBrains Mono', 'Pretendard', monospace;
      color: #e6edf3;
      line-height: 1.7;
      font-size: 15px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px 32px;
    }

    /* GitHub Alerts */
    .gh-alert { border-left: 4px solid; padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 1.2em 0; }
    .gh-alert-title { font-weight: 700; margin-bottom: 6px; }
    .gh-alert-note { border-color: #58a6ff; background: rgba(88, 166, 255, 0.08); color: #c9d1d9; }
    .gh-alert-tip { border-color: #3fb950; background: rgba(63, 185, 80, 0.08); color: #c9d1d9; }
    .gh-alert-warning { border-color: #d29922; background: rgba(210, 153, 34, 0.08); color: #c9d1d9; }

    /* TOC Sidebar */
    .toc-sidebar {
      width: 260px;
      border-left: 1px solid var(--border-subtle);
      background: #090d14;
      padding: 24px 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .toc-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
    .toc-link { color: var(--text-secondary); font-size: 0.8rem; text-decoration: none; display: block; padding: 4px 8px; border-radius: 4px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toc-link:hover { color: #fff; background: var(--bg-surface); }
    .toc-h3 { padding-left: 18px; font-size: 0.75rem; color: var(--text-muted); }

    @media (max-width: 800px) {
      .toc-sidebar { display: none; }
      .content-wrap { padding: 24px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">
      <span>🐓 ROOSTER RUMBLE</span>
      <span style="color: var(--text-muted); font-weight: 400;">|</span>
      <span id="docTitle" style="color: var(--accent-cyan); font-weight: 600;">문서 뷰어</span>
    </a>
    <div class="header-actions">
      <button id="btnThemeViewer" class="btn" onclick="toggleViewerTheme()">☀️ 라이트 모드</button>
      <button id="btnPinDoc" class="btn btn-pin" style="display:none;" onclick="toggleCurrentDocPin()">📌 필독 등록</button>
      <a href="index.html" class="btn">🏠 웹보드 홈</a>
      <a id="btnDownload" href="#" download class="btn">💾 다운로드</a>
    </div>
  </header>

  <div id="toastBox" class="toast-box"></div>

  <div class="layout">
    <div class="content-wrap">
      <article class="markdown-body" id="articleBody">
        <p>문서를 불러오는 중입니다...</p>
      </article>
    </div>
    <aside class="toc-sidebar">
      <div class="toc-title">📑 문서 목차 (TOC)</div>
      <div id="tocList"></div>
    </aside>
  </div>

  <script>
    const THEME_STORAGE_KEY = 'rooster_webboard_theme';
    const FONT_STORAGE_KEY = 'rooster_webboard_font_size';
    const FONT_PX_STORAGE_KEY = 'rooster_webboard_font_px';
    const PINNED_STORAGE_KEY = 'rooster_pinned_issues';
    let currentItem = null;
    let pinnedIssueIds = new Set();

    function initViewerTheme() {
      let savedTheme = 'dark';
      try {
        savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';
      } catch(e) {}
      applyViewerTheme(savedTheme);

      try {
        const savedPx = localStorage.getItem(FONT_PX_STORAGE_KEY);
        if (savedPx && !isNaN(savedPx)) {
          document.documentElement.style.fontSize = savedPx + 'px';
        } else {
          const savedFont = localStorage.getItem(FONT_STORAGE_KEY) || 'small';
          document.documentElement.setAttribute('data-font-size', savedFont);
        }
      } catch(e) {}
    }

    function applyViewerTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('btnThemeViewer');
      if (btn) {
        btn.textContent = theme === 'light' ? '🌙 다크 모드' : '☀️ 라이트 모드';
      }
    }

    function toggleViewerTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = cur === 'light' ? 'dark' : 'light';
      applyViewerTheme(next);
      try {
        localStorage.setItem(THEME_STORAGE_KEY, next);
      } catch(e) {}
      showToast(next === 'light' ? '☀️ 화이트 모드로 전환되었습니다.' : '🌙 다크 모드로 전환되었습니다.');
    }

    function loadPinnedIds() {
      try {
        const raw = localStorage.getItem(PINNED_STORAGE_KEY);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) pinnedIssueIds = new Set(arr);
        }
      } catch(e) {
        console.warn('localStorage 로드 실패:', e);
      }
    }

    function savePinnedIds() {
      try {
        localStorage.setItem(PINNED_STORAGE_KEY, JSON.stringify(Array.from(pinnedIssueIds)));
      } catch(e) {
        console.warn('localStorage 저장 실패:', e);
      }
    }

    function updatePinBtnUI() {
      const btn = document.getElementById('btnPinDoc');
      if (!currentItem || currentViewerRole !== 'master') {
        if (btn) btn.style.display = 'none';
        return;
      }
      btn.style.display = 'inline-flex';
      const isPinned = pinnedIssueIds.has(currentItem.id);
      if (isPinned) {
        btn.innerHTML = '🚨 필독 해제';
        btn.classList.add('pinned');
      } else {
        btn.innerHTML = '📌 필독 등록';
        btn.classList.remove('pinned');
      }
    }

    function toggleCurrentDocPin() {
      if (!currentItem) return;
      if (currentViewerRole !== 'master') {
        showToast('⚠️ 마스터 권한만 필독 등록을 변경할 수 있습니다.');
        return;
      }
      const isPinned = pinnedIssueIds.has(currentItem.id);
      if (isPinned) {
        pinnedIssueIds.delete(currentItem.id);
        showToast(`'${currentItem.title}' 필독 목록에서 해제되었습니다.`);
      } else {
        pinnedIssueIds.add(currentItem.id);
        showToast(`'${currentItem.title}' 주요 이슈(필독)로 등록되었습니다!`);
      }
      savePinnedIds();
      updatePinBtnUI();
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.add('show');
      setTimeout(() => box.classList.remove('show'), 2800);
    }

    const AUTH_DEFAULT_VIEW_HASH = '234db10889b3431b8643d3d5c8b0793f37ffc99c61234cc3647a9391749328e9';
    const AUTH_MASTER_HASH       = 'babe841284387418613efb043eadeb934c3d691c7a57e4fb9148798f144f63d9';
    const AUTH_CUSTOM_VIEW_KEY   = 'rooster_auth_custom_view_hash';
    const AUTH_SESSION_KEY       = 'rooster_auth_session_token';
    const AUTH_ROLE_KEY          = 'rooster_auth_role';
    let currentViewerRole        = 'viewer';

    async function hashViewerPw(str) {
      if (window.crypto && crypto.subtle) {
        const msgBuffer = new TextEncoder().encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return '';
    }

    function isViewerAuthorized() {
      try {
        const sessionToken = sessionStorage.getItem(AUTH_SESSION_KEY) || localStorage.getItem(AUTH_SESSION_KEY);
        const sessionRole  = sessionStorage.getItem(AUTH_ROLE_KEY) || localStorage.getItem(AUTH_ROLE_KEY);
        const activeHash = localStorage.getItem(AUTH_CUSTOM_VIEW_KEY) || AUTH_DEFAULT_VIEW_HASH;
        if (sessionToken === AUTH_MASTER_HASH) {
          currentViewerRole = 'master';
          return true;
        } else if (sessionToken === activeHash) {
          currentViewerRole = (sessionRole === 'master') ? 'master' : 'viewer';
          return true;
        }
        return false;
      } catch(e) {
        return false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initViewerTheme();
      loadPinnedIds();

      if (!isViewerAuthorized()) {
        document.title = '보안 확인';
        renderAuthPrompt();
        return;
      }

      loadDocumentContent();
    });

    function renderAuthPrompt() {
      document.querySelector('.toc-sidebar').style.display = 'none';
      const header = document.querySelector('header');
      if (header) header.style.display = 'none';

      document.getElementById('articleBody').innerHTML = `
        <div style="max-width: 320px; margin: 80px auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 24px 20px; text-align: left; box-shadow: 0 16px 40px rgba(0,0,0,0.6);">
          <form onsubmit="handleViewerAuth(event)" style="display:flex; flex-direction:column; gap:12px;">
            <input type="password" id="viewerPwInput" placeholder="비밀번호 입력" style="width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-subtle); background: var(--bg-base); color: var(--text-main); font-size: 0.95rem; outline: none;" autofocus required>

            <div id="viewerAuthError" style="font-size: 0.8rem; color: #ff5252; min-height: 16px; font-weight: 600;"></div>

            <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 10px; background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; font-weight: 700;">
              확인
            </button>
          </form>
        </div>
      `;
    }

    async function handleViewerAuth(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('viewerPwInput');
      const error = document.getElementById('viewerAuthError');
      const val = input.value.trim();
      if (!val) return;

      const hash = await hashViewerPw(val);
      const activeHash = localStorage.getItem(AUTH_CUSTOM_VIEW_KEY) || AUTH_DEFAULT_VIEW_HASH;

      if (hash === AUTH_MASTER_HASH) {
        currentViewerRole = 'master';
        sessionStorage.setItem(AUTH_SESSION_KEY, hash);
        sessionStorage.setItem(AUTH_ROLE_KEY, 'master');
        localStorage.setItem(AUTH_SESSION_KEY, hash);
        localStorage.setItem(AUTH_ROLE_KEY, 'master');
        const header = document.querySelector('header');
        if (header) header.style.display = 'flex';
        document.querySelector('.toc-sidebar').style.display = 'block';
        loadDocumentContent();
      } else if (hash === activeHash) {
        currentViewerRole = 'viewer';
        sessionStorage.setItem(AUTH_SESSION_KEY, hash);
        sessionStorage.setItem(AUTH_ROLE_KEY, 'viewer');
        localStorage.setItem(AUTH_SESSION_KEY, hash);
        localStorage.setItem(AUTH_ROLE_KEY, 'viewer');
        const header = document.querySelector('header');
        if (header) header.style.display = 'flex';
        document.querySelector('.toc-sidebar').style.display = 'block';
        loadDocumentContent();
      } else {
        error.textContent = '❌ 비밀번호가 올바르지 않습니다.';
        input.value = '';
        input.focus();
      }
    }

    function loadDocumentContent() {
      const params = new URLSearchParams(window.location.search);
      const itemId = params.get('id');
      const fileUrl = params.get('file');

      let targetItem = null;
      if (window.BOARD_DATA && window.BOARD_DATA.items) {
        if (itemId) {
          targetItem = window.BOARD_DATA.items.find(i => i.id === itemId);
        } else if (fileUrl) {
          targetItem = window.BOARD_DATA.items.find(i => i.url === fileUrl);
        }
      }

      currentItem = targetItem;
      updatePinBtnUI();

      if (targetItem) {
        if (currentViewerRole !== 'master' && targetItem.is_hidden) {
          document.getElementById('articleBody').innerHTML = `
            <div style="max-width: 440px; margin: 80px auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 32px 24px; text-align: center;">
              <div style="font-size: 2.2rem; margin-bottom: 8px;">🔒</div>
              <h3 style="font-size: 1.15rem; color: var(--text-main); margin-bottom: 6px;">비공개 문서</h3>
              <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px;">
                본 문서는 비공개 상태로 마스터 권한자만 열람할 수 있습니다.
              </p>
              <a href="index.html" class="btn" style="background: var(--accent-primary); border-color: var(--accent-primary); color: #fff;">
                웹보드 홈으로 이동
              </a>
            </div>
          `;
          document.querySelector('.toc-sidebar').style.display = 'none';
          return;
        }

        document.getElementById('docTitle').textContent = targetItem.title;
        document.getElementById('btnDownload').href = encodeURI(targetItem.url);
        document.title = `${targetItem.title} — ROOSTER RUMBLE`;

        if (targetItem.content) {
          if (targetItem.ext === 'txt') {
            renderPlainText(targetItem.content);
          } else {
            renderMarkdown(targetItem.content);
          }
          return;
        }
      }

      const urlToFetch = targetItem ? targetItem.url : fileUrl;
      const isTxt = urlToFetch && urlToFetch.toLowerCase().endsWith('.txt');
      if (urlToFetch) {
        fetch(encodeURI(urlToFetch))
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.text();
          })
          .then(text => {
            if (isTxt) renderPlainText(text);
            else renderMarkdown(text);
          })
          .catch(err => {
            document.getElementById('articleBody').innerHTML = `
              <h3>문서를 불러올 수 없습니다.</h3>
              <p>${err}</p>
            `;
          });
      } else {
        document.getElementById('articleBody').innerHTML = `<h3>요청한 문서 정보가 없습니다.</h3>`;
      }
    }

    function renderPlainText(rawText) {
      document.getElementById('articleBody').innerHTML = `
        <div class="text-body-wrap">${escapeHtml(rawText)}</div>
      `;
      document.querySelector('.toc-sidebar').style.display = 'none';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderMarkdown(rawText) {
      // Process alerts
      let processed = rawText.replace(
        /> \[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\n((?:> .*(?:\n|$))*)/gi,
        (match, type, content) => {
          const typeLower = type.toLowerCase();
          const cleanContent = content.replace(/^> ?/gm, '');
          return `<div class="gh-alert gh-alert-${typeLower}"><div class="gh-alert-title">${type}</div>${cleanContent}</div>\n\n`;
        }
      );

      marked.setOptions({ gfm: true, breaks: true });
      document.getElementById('articleBody').innerHTML = marked.parse(processed);

      // TOC
      setTimeout(() => {
        const headings = document.getElementById('articleBody').querySelectorAll('h1, h2, h3');
        const toc = document.getElementById('tocList');
        if (headings.length === 0) {
          toc.innerHTML = '<span style="font-size:0.75rem; color:var(--text-muted);">목차 없음</span>';
          return;
        }
        let html = '';
        headings.forEach((h, idx) => {
          const id = `sec-${idx}`;
          h.id = id;
          const tag = h.tagName.toLowerCase();
          html += `<a href="#${id}" class="toc-link toc-${tag}" onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'}); return false;">${h.textContent.trim()}</a>`;
        });
        toc.innerHTML = html;
      }, 50);
    }
  </script>
</body>
</html>
